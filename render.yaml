services:
  - type: web
    name: prinikki
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: prinikki-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: prinikki-db
    plan: basic-256mb
    databaseName: prinikki
    user: prinikki
